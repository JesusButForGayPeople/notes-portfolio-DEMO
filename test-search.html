<!DOCTYPE html>
<html>

<head>
    <title>Search Test</title>
</head>

<body>
    <h1>Search Test</h1>
    <div id="result"></div>

    <script>
        fetch('/search.json')
            .then(response => {
                document.getElementById('result').innerHTML = `Status: ${response.status}<br>`;
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            })
            .then(data => {
                document.getElementById('result').innerHTML += `Success! Found ${data.length} items in search index.`;
            })
            .catch(error => {
                document.getElementById('result').innerHTML += `Error: ${error.message}`;
            });
    </script>
</body>

</html>
