name: Simple Deploy

on:
  push:
    branches: [ main, blog ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      
      - name: Install dependencies
        run: bundle install
      
      - name: Build site
        run: bundle exec jekyll build
      
      - name: Copy search.json to root
        run: cp _site/search.json .
      
      - name: Commit and push search.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add search.json
          if git diff --staged --quiet; then
            echo "No changes to search.json"
          else
            git commit -m "Update search index"
            git push
          fi 