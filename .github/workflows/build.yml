name: Build and Deploy

on:
  push:
    branches: [ main, blog ]
  pull_request:
    branches: [ main, blog ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0'
        bundler-cache: true
    
    - name: Install dependencies
      run: bundle install
    
    - name: Build site
      run: bundle exec jekyll build
    
    - name: Copy search.json to root
      run: cp _site/search.json .
    
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add search.json
        git diff --staged --quiet || git commit -m "Update search.json"
        git push 